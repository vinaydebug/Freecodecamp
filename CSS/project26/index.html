<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Inventory</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Book Inventory</h1>
    <div class="book_catalog">
        <span class="divider_point"><span class="left_circle"></span></span>
        <img src="https://cdn-icons-png.flaticon.com/128/10221/10221707.png" alt="book icon" class="book_icon">
        <span class="divider_point"><span class="right_circle"></span></span>
    </div>
    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Category</th>
                <th>Status</th>
                <th>Rate</th>
            </tr>
        </thead>
        <tbody>
            <tr class="read">
                <th>The Alchemist</th>
                <td>Paulo Coelho</td>
                <td>Fiction</td>
                <td><span class="status">Read</span></td>
                <td><span class="rate three">
                        <span></span><span></span><span></span>
                    </span></td>
            </tr>
        </tbody>
    </table>
</body>

</html>
