<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Availability Table</title>
    <link rel="stylesheet" href="styles.css">       
</head>
<body>
    <main class="table_container">
        <table>
            <caption>Weekly Meeting Availability Schedule</caption>
            <tbody>
                <tr class="sharp">
                    <th class="time" scope="row" rowspan="2">9 AM</th>
                    <th scope="col">monday</th>
                    <th scope="col">tuesday</th>
                    <th scope="col">wednesday</th>
                    <th scope="col">thursday</th>
                    <th scope="col">friday</th>
                </tr>
                <tr class="half">
                    <td class="available-2" aria-label="2 available"></td>
                    <td class="available-3" aria-label="3 available"></td>
                    <td class="available-0" aria-label="0 available"></td>
                    <td class="available-3" aria-label="3 available"></td>
                    <td class="available-5" aria-label="5+ available"></td>
                </tr>
                <tr class="sharp">
                    <th class="time" scope="row" rowspan="2">10 AM</th>
                    <td class="available-3" aria-label="3 available"></td>
                    <td class="available-4" aria-label="4 available"></td>
                    <td class="available-3" aria-label="3 available"></td>
                    <td class="available-4" aria-label="4 available"></td>
                    <td class="available-3" aria-label="3 available"></td>
                </tr>
                <tr class="half">
                    <td class="available-2" aria-label="2 available"></td>
                    <td class="available-5" aria-label="5+ available"></td>
                    <td class="available-2" aria-label="2 available"></td>
                    <td class="available-5" aria-label="5+ available"></td>
                    <td class="available-2" aria-label="2 available"></td>
                </tr>
                <tr class="sharp">
                    <th class="time" scope="row" rowspan="2">11 AM</th>
                    <td class="available-0" aria-label="0 available"></td>
                    <td class="available-3" aria-label="3 available"></td>
                    <td class="available-3" aria-label="3 available"></td>
                    <td class="available-3" aria-label="3 available"></td>
                    <td class="available-0" aria-label="0 available"></td>
                </tr>
                <tr class="half">
                    <td class="available-0" aria-label="0 available"></td>
                    <td class="available-3" aria-label="3 available"></td>
                    <td class="available-1" aria-label="1 available"></td>
                    <td class="available-3" aria-label="3 available"></td>
                    <td class="available-1" aria-label="1 available"></td>
                </tr>
                <tr class="sharp">
                    <th class="time" scope="row" rowspan="2">12 AM</th>
                    <td class="available-2" aria-label="2 available"></td>
                    <td class="available-3" aria-label="3 available"></td>
                    <td class="available-2" aria-label="2 available"></td>
                    <td class="available-3" aria-label="3 available"></td>
                    <td class="available-2" aria-label="2 available"></td>
                </tr>
                <tr class="half">
                    <td class="available-2" aria-label="2 available"></td>
                    <td class="available-3" aria-label="3 available"></td>
                    <td class="available-2" aria-label="2 available"></td>
                    <td class="available-3" aria-label="3 available"></td>
                    <td class="available-5" aria-label="5+ available"></td>
                </tr>
                <tr class="sharp">
                    <th class="time" scope="row" rowspan="2">1 PM</th>
                    <td class="available-5" aria-label="5+ available"></td>
                    <td class="available-3" aria-label="3 available"></td>
                    <td class="available-0" aria-label="0 available"></td>
                    <td class="available-5" aria-label="5+ available"></td>
                    <td class="available-5" aria-label="5+ available"></td>
                </tr>
            </tbody>
        </table>
        <div id="legend">
            <span>Availability</span>
            <div class="legend-line">
                <span>0</span>
                <div id="legend-gradient"></div>
                <span>+5</span>
            </div>
        </div>
    </main>
</body>
</html>
